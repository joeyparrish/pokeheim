name: Build, package, release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  build:
    # We pinned to ubuntu-22.04 in 2025 to keep mono, msbuild and nuget
    # working.  None of those are used any more, so track the current image
    # instead: pinning is what let this rot unnoticed for three years, and a
    # breakage we find on the next push is cheaper than one we find in 2029.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Valheim version id
        id: valheimversion
        run: echo "valheimversion=$(curl -s https://api.steamcmd.net/v1/info/896660 | jq -r '.data."896660".depots.branches.public.buildid')" >> "$GITHUB_OUTPUT"

      - name: Get BepInEx version
        id: bepinexversion
        run: echo "bepinexversion=$(./scripts/get-dep-version.sh denikson-BepInExPack_Valheim)" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache Valheim
        id: cachevalheim
        uses: actions/cache@v6
        with:
          path: ~/VHINSTALL
          key: ${{ steps.valheimversion.outputs.valheimversion }}-BepInExPack-${{ steps.bepinexversion.outputs.bepinexversion }}

      - name: Install SteamCMD
        if: steps.cachevalheim.outputs.cache-hit != 'true'
        uses: CyberAndrii/setup-steamcmd@v1

      - name: Prepare Pokeheim dependencies
        if: steps.cachevalheim.outputs.cache-hit != 'true'
        run: |
          wget -O bepinex.zip "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/${{ steps.bepinexversion.outputs.bepinexversion }}/"
          unzip bepinex.zip -d ~/BepInExRaw
          # Two ordering requirements here, both of which fail the same way if
          # you get them wrong, with "Missing configuration":
          #  - force_install_dir has to come before login, or newer steamcmd
          #    rejects it with "Please use force_install_dir before logon!"
          #  - app_info_update is required before app_update, because runners
          #    are ephemeral and a cold steamcmd has no app info cached.
          #    Re-running the job does not help, since it starts cold again.
          steamcmd +force_install_dir "$HOME/VHINSTALL" +login anonymous +app_info_update 1 +app_update 896660 validate +exit
          # We build against the dedicated server, whose data directory is
          # named valheim_server_Data.  Jotunn's Paths.props only looks for
          # Valheim_Data or valheim_Data when setting VALHEIM_MANAGED, so
          # rename it.  (Jotunn's build task accepts valheim_server_Data, and
          # since 2.30.0 matches case-insensitively, but Paths.props does
          # neither.)
          mv ~/VHINSTALL/valheim_server_Data/ ~/VHINSTALL/Valheim_Data/
          mv ~/BepInExRaw/BepInExPack_Valheim/* ~/VHINSTALL/

      - name: Remove stale generated DLLs
        run: |
          # Publicized assemblies are regenerated from the game DLLs, and a
          # stale set silently builds against the wrong game version.
          rm -rf ~/VHINSTALL/Valheim_Data/Managed/publicized_assemblies
          rm -rf ~/VHINSTALL/BepInEx/plugins/MMHOOK

      - name: Set references to DLLs
        run: |
          echo "<?xml version=\"1.0\" encoding=\"utf-8\"?><Project ToolsVersion=\"Current\" xmlns=\"http://schemas.microsoft.com/developer/msbuild/2003\"><PropertyGroup><VALHEIM_INSTALL>$HOME/VHINSTALL/</VALHEIM_INSTALL></PropertyGroup></Project>" > Environment.props

      - name: Build debug version
        # The build finds the game through Environment.props, written above.
        run: ./scripts/build.sh Debug

      # Set the version to the tag, if this was a tag push.
      - name: Prepare release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          RELEASE_VERSION=$(echo "${{ github.ref }}" | sed -e 's@refs/tags/@@')
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          echo "Setting release version to $RELEASE_VERSION"

      # Set a dummy default version for CI builds generated on every push or on
      # pull requests.
      - name: Build release zip
        run: |
          RELEASE_VERSION="${RELEASE_VERSION:-0.0.1}" ./scripts/package.sh

      - uses: actions/upload-artifact@v7
        with:
          # Will result in Pokeheim.zip
          name: Pokeheim
          # Everything in this folder will be archived, but not the folder
          path: staging/

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Pokeheim.zip
